[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granttrace"
version = "2.5.1"
description = "Safety-first OpenAPI authorization auditing tool for BOLA, IDOR and Mass Assignment testing"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "GrantTrace contributors"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security"
]

[project.urls]
Repository = "https://github.com/ysc070528/granttrace"
Issues = "https://github.com/ysc070528/granttrace/issues"
Changelog = "https://github.com/ysc070528/granttrace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6,<1", "mypy>=1.11,<3", "coverage[toml]>=7.6,<8", "types-PyYAML>=6,<7"]

[project.scripts]
granttrace = "api_sentinel:main"

[tool.setuptools]
py-modules = ["api_sentinel"]

[tool.setuptools.packages.find]
include = ["core*", "mock_server*"]

[tool.setuptools.package-data]
"core.demo_assets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
# Explicit baseline avoids future defaults forcing a broad modernization.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["core", "api_sentinel"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.xml]
output = "dist/coverage.xml"

[tool.coverage.json]
output = "dist/coverage.json"

[tool.mypy]
# Type-check product code on the quality job's interpreter.
python_version = "3.12"
files = ["api_sentinel.py", "core"]
check_untyped_defs = true


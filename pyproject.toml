[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granttrace"
version = "2.3.1"
description = "Safety-first OpenAPI authorization and mass-assignment audit prototype"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "GrantTrace contributors"}]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
granttrace = "api_sentinel:main"

[tool.setuptools]
py-modules = ["api_sentinel"]

[tool.setuptools.packages.find]
include = ["core*", "mock_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"


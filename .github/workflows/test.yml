name: GrantTrace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: granttrace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.6,<1"
      - name: Check Python sources, scripts and tests
        run: python -m ruff check . --output-format github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node for offline report interaction tests
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . setuptools wheel "coverage[toml]>=7.6,<8"

      - name: Run unittest suite with branch coverage
        run: python -m coverage run -m unittest discover -s tests

      - name: Report test coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m coverage report | tee dist/coverage.txt
          python -m coverage xml
          python -m coverage json
          {
            echo '### Python ${{ matrix.python-version }} code coverage'
            echo '```text'
            cat dist/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify business authorization scenarios
        run: python scripts/verify_business_scenarios.py

      - name: Verify JSON and YAML scans and restoration
        run: python scripts/verify_examples.py

      - name: Verify installed wheel outside source checkout
        run: python scripts/verify_install.py

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-python-${{ matrix.python-version }}
          retention-days: 14
          path: |
            dist/coverage.txt
            dist/coverage.xml
            dist/coverage.json
            dist/business-scenarios.json
            dist/install-verification.json
            dist/mock-validation/
            dist/demo-validation/

  types:
    name: Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install type checker and declared dependencies
        run: python -m pip install . "mypy>=1.11,<3" "types-PyYAML>=6,<7"
      - name: Enforce type checks
        id: mypy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m mypy | tee dist/mypy.txt
      - name: Record type-check outcome
        if: always()
        run: |
          {
            echo '### Mypy: ${{ steps.mypy.outcome }}'
            echo 'Type checks are enforced as a CI quality gate.'
            echo '```text'
            cat dist/mypy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-diagnostics
          path: dist/mypy.txt
          retention-days: 14

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        run: python -m pip install "pip-audit>=2.10,<3"
      - name: Audit resolved project runtime dependencies
        run: |
          mkdir -p dist
          python -m pip_audit --strict --progress-spinner off --format json --output dist/pip-audit.json .
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-dependency-audit
          path: dist/pip-audit.json
          retention-days: 14

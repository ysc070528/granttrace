name: GrantTrace CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . setuptools wheel

      - name: Run tests
        run: |
          python -m unittest discover -s tests

      - name: Verify business authorization scenarios
        run: python scripts/verify_business_scenarios.py

      - name: Verify JSON and YAML scans and restoration
        run: python scripts/verify_examples.py

      - name: Verify installed wheel outside source checkout
        run: python scripts/verify_install.py

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-python-${{ matrix.python-version }}
          path: |
            dist/business-scenarios.json
            dist/install-verification.json
            dist/mock-validation/
